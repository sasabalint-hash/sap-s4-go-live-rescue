<style>
:root{

*{box-sizing:border-box;}
html,body{height:100%;}

}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
button:focus-visible, a:focus-visible, [tabindex]:focus-visible{

}
.screen{display:none;min-height:100vh;width:100%;}
.screen.active{display:block;}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px;}
.btn{
  border:none;border-radius:14px;padding:16px 28px;font-size:1.05rem;font-weight:700;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--sap-blue);color:#fff;box-shadow:0 8px 24px rgba(0,140,200,.35);}
.btn-secondary{background:transparent;color:var(--white);border:2px solid rgba(255,255,255,.4);}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--white);border:1px solid rgba(255,255,255,.15);}
.btn-sm{padding:10px 16px;font-size:.9rem;border-radius:10px;}
.card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:22px;
  backdrop-filter: blur(6px);
}
.light-card{

  color:var(--navy);
  border-radius:18px;
  padding:22px;
  box-shadow:0 10px 30px rgba(7,26,43,.25);
}
.pill{
  display:inline-flex;align-items:center;gap:6px;

  border:1px solid rgba(0,140,200,.4);

}
.tooltip{
  position:relative;border-bottom:1px dashed #8fd6f5;cursor:help;
}
.tooltip .tip{
  visibility:hidden;opacity:0;position:absolute;left:0;bottom:130%;
  background:var(--navy);color:#fff;padding:10px 12px;border-radius:10px;
  font-size:.8rem;font-weight:400;width:260px;box-shadow:0 8px 20px rgba(0,0,0,.35);
  transition:opacity .15s ease; z-index:30; line-height:1.4;
}
.tooltip:hover .tip, .tooltip:focus .tip{visibility:visible;opacity:1;}
.metric-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;}
.metric-fill{height:100%;border-radius:99px;transition:width .5s ease;}
.grid-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.mission-progress{display:flex;gap:6px;}
.mission-dot{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.15);}
.mission-dot.done{background:var(--success);}
.mission-dot.current{background:var(--sap-blue);}
.option-card{
  text-align:left;width:100%;border-radius:16px;padding:18px 20px;
  background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.14);color:#fff;
  transition:.15s ease;
}
.option-card:hover{border-color:var(--sap-blue);background:rgba(0,140,200,.12);}
.option-card.selected{border-color:var(--success);background:rgba(46,173,115,.15);}
.option-card .opt-title{font-weight:700;font-size:1.02rem;margin-bottom:4px;}
.option-card .opt-desc{font-size:.88rem;color:#c9d6e3;line-height:1.4;}
.badge-ai{
  display:inline-block;background:linear-gradient(90deg,#008CC8,#2EAD73);
  color:#04202e;font-weight:800;font-size:.72rem;border-radius:999px;padding:2px 10px;margin-left:8px;

.fade-in{animation:fadeIn .35s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.pulse{animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.scroll-x{overflow-x:auto;}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:99px;}
.top-bar{
  position:sticky;top:0;z-index:20;
  padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(180deg, rgba(7,26,43,.96), rgba(7,26,43,.85));
  border-bottom:1px solid rgba(255,255,255,.08);

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
.reduced-motion *{animation:none !important; transition:none !important;}
.modal-overlay{
  position:fixed;inset:0;background:rgba(4,15,26,.72);display:flex;align-items:center;justify-content:center;

.modal-box{max-width:560px;width:100%;max-height:85vh;overflow-y:auto;}
.metric-icon{font-size:1.1rem;}
.leaderboard-table{width:100%;border-collapse:collapse;}
.leaderboard-table th,.leaderboard-table td{padding:8px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.1);font-size:.88rem;}
.leaderboard-table th{color:#8fd6f5;font-weight:700;}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
</style>
</head>

function glossify(text){
  let out = text;
  Object.keys(GLOSSARY).sort((a,b)=>b.length-a.length).forEach(term=>{
    const re = new RegExp('\\b'+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','g');
    out = out.replace(re, m => `<span class="tooltip" tabindex="0">${m}<span class="tip">${GLOSSARY[term]}</span></span>`);
  });
  return out;
}

/* ---------------------------------------------------------
   7. SCORING
--------------------------------------------------------- */
function clampMetrics(){
  METRIC_DEFS.forEach(m=>{
    S.metrics[m.key] = Math.max(0, Math.min(100, Math.round(S.metrics[m.key])));
  });
}
function applyOption(mission, opt){
  Object.entries(opt.metrics||{}).forEach(([k,v])=>{
    if(S.metrics[k]!==undefined) S.metrics[k]+=v;
  });
  Object.entries(opt.skills||{}).forEach(([k,v])=>{
    S.skills[k]=(S.skills[k]||0)+v;
  });
  (opt.flags||[]).forEach(f=>{ S.flags[f]=(S.flags[f]||0)+1; });
  if(opt.needsAI) S.aiUsed[mission.id]=true;
  clampMetrics();
  S.decisions.push({mission:mission.id, option:opt.label});
}

function computeTotalScore(){
  // 60% from visible metrics average, 40% from hidden skills (normalized)
  const metricAvg = METRIC_DEFS.reduce((s,m)=>s+S.metrics[m.key],0)/METRIC_DEFS.length; // 0-100
  const skillVals = SKILL_DEFS.map(k=>S.skills[k]);
  const skillSum = skillVals.reduce((a,b)=>a+b,0);
  // normalize skillSum roughly into 0-100 range (max plausible ~ 30)
  const skillScore = Math.max(0, Math.min(100, 50 + skillSum*2.2));
  const total = metricAvg*0.6 + skillScore*0.4;
  return Math.round(Math.max(0, Math.min(100, total)) * 10); // 0-1000
}

function topSkills(){
  const entries = SKILL_DEFS.map(k=>[k, S.skills[k]||0]);
  entries.sort((a,b)=>b[1]-a[1]);
  return entries;
}

function determineArchetype(){
  // check extreme profiles first
  for(const ex of EXTREME_PROFILES){
    if((S.flags[ex.flag]||0) >= ex.min){
      return {primary:ex, secondaryKey:topSkills()[0][0], extreme:true};
    }
  }
  const sorted = topSkills();
  const primaryKey = sorted[0][0];
  const secondaryKey = sorted[1][0];
  return {primary:ARCHETYPES[primaryKey], secondaryKey, extreme:false, primaryKey};
}

function determineOutcome(){
  const m = S.metrics;
  const score = computeTotalScore();
  const postponed = S.decisions.some(d=>d.option.includes('halasztást javaslok') || d.option.includes('halasztás'));
  if(score>=780 && m.goLive>=65 && m.trust>=55){
    return {key:'green', title:'Sikeres SAP S/4HANA go-live', desc:'A rendszer kontrollált kockázatokkal, összehangolt stakeholderekkel és világos hypercare tervvel indul el.', color:'var(--success)'};
  }
  if(postponed && m.trust>=45){
    return {key:'postpone', title:'Felelős halasztás', desc:'Megakadályoztad egy kockázatos indulást, és hiteles helyreállítási tervet készítettél. Ez nem kudarc — ez felelős döntés.', color:'var(--sap-blue)'};
  }
  if(score>=600){
    return {key:'conditional', title:'Feltételes go-live', desc:'A projekt folytatódhat, de csak meghatározott mitigációs intézkedésekkel, felelősökkel és fokozott támogatással.', color:'var(--warning)'};
  }
  if(m.goLive>=45 && (m.data<45 || m.integration<45)){
    return {key:'chaotic', title:'Élesítés kontrollált káoszban', desc:'A rendszer elindul, de a hypercare csapatnak komoly mennyiségű kávéra lesz szüksége.', color:'var(--warning)'};
  }
  return {key:'disaster', title:'Rendkívüli steering committee összehívva', desc:'A rövid távú látszat mellett döntöttél, miközben komoly SAP, folyamat- vagy adatkockázatok maradtak megoldatlanul.', color:'var(--risk)'};
}

function finalizeResult(){
  const arche = determineArchetype();
  const outcome = determineOutcome();
  const careerKey = arche.primaryKey || topSkills()[0][0];
  const career = CAREERS[careerKey];
  const score = computeTotalScore();
  const strengths = topSkills().slice(0,3).map(([k])=>skillLabel(k));
  const devArea = topSkills()[topSkills().length-1];
  const timeMs = Date.now()-S.startTime;
  S.result = {
    score, outcome, archetype:arche.primary, secondary: arche.extreme? null : ARCHETYPES[arche.secondaryKey],
    career, strengths, devArea: skillLabel(devArea[0]), timeMs,
    aiStyle: computeAiStyle(),
  };
  S.completed = true;
  saveToLeaderboard();
}

function skillLabel(k){
  const map = {processThinking:'Folyamatgondolkodás', businessInsight:'Üzleti rálátás', financeData:'Pénzügy és adatlogika',
    integrationThinking:'Integrációs gondolkodás', stakeholder:'Stakeholder menedzsment', delivery:'Teljesítés nyomás alatt',
    aiJudgment:'AI-ítélőképesség', fitStandard:'Fit-to-standard szemlélet', risk:'Kockázatkezelés', chaos:'Káosz-tűrés'};
  return map[k]||k;
}

function computeAiStyle(){
  const validated = S.flags['aiValidated']||0;
  const blind = S.flags['aiBlind']||0;
  if(validated>=2) return 'Tudatos AI-használó vagy: gyorsítasz vele, de mindig ellenőrzöd, amit mond.';
  if(blind>=2) return 'Hajlamos vagy megbízni az AI gyors válaszaiban — érdemes tudatosabban validálni az outputot.';
  return 'Kiegyensúlyozottan használod az AI-t: néhol támaszkodsz rá, néhol inkább magad jársz utána.';
}

  document.getElementById('btn-next').onclick = ()=>{

      S.screen='result';

function flashMsg(text){
  const el = document.createElement('div');

  el.setAttribute('role','status');

  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}

function renderLeaderboard(){
  const board = loadBoard().slice().sort((a,b)=>b.score-a.score);

  <div class="screen active fade-in">

        </table>` : `<p style="color:#a9c1d3;">Még nincs mentett eredmény.</p>`}
      </div>
      <div class="chip-row" style="margin-top:16px;">
        ${fastestGreen? `<span class="pill">⚡ Leggyorsabb sikeres go-live: ${esc(fastestGreen.nickname)} (${fmtTime(fastestGreen.timeMs)})</span>`:''}
        ${bestAI? `<span class="pill">🤖 Legjobb AI-ítélőképesség: ${esc(bestAI.nickname)}</span>`:''}
        ${bestData? `<span class="pill">🗂️ Legjobb adatminőség: ${esc(bestData.nickname)}</span>`:''}
      </div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:26px 0;">
        <button class="btn btn-primary" id="btn-back">Vissza az eredményhez</button>
        <button class="btn btn-ghost" id="btn-replay2">Újrajátszom</button>

}

function confirmReplay(){
  if(confirm('Biztosan új projektet indítasz? A jelenlegi eredményed elvész (a ranglistán marad).')){
    clearState();
    S = freshState();
    render();
  }
}

/* ---------------------------------------------------------
   11. MODAL / RESUME PROMPT
--------------------------------------------------------- */
function showModal(title, html){
  const overlay = document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="light-card modal-box" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h3 style="color:var(--navy);margin-bottom:14px;">${esc(title)}</h3>
    <div style="color:var(--navy);">${html}</div>
    <div style="text-align:right;margin-top:18px;"><button class="btn btn-primary btn-sm" id="modal-close">Bezárás</button></div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('modal-close').onclick = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
}

function maybeShowResume(){
  const raw = localStorage.getItem(LS_KEY);
  if(!raw) return false;
  try{
    const saved = JSON.parse(raw);
    if(saved && saved.screen && saved.screen!=='landing' && !saved.completed){
      const overlay = document.createElement('div');
      overlay.className='modal-overlay';
      overlay.innerHTML = `<div class="light-card modal-box" role="dialog" aria-modal="true">
        <h3 style="color:var(--navy);margin-bottom:10px;">Folytatod a korábbi projektet?</h3>
        <p style="color:var(--navy);margin-bottom:18px;">Találtunk egy mentett SAP S/4HANA projektet: <strong>${esc(saved.nickname||'Névtelen tanácsadó')}</strong>.</p>
        <div style="display:flex;gap:12px;justify-content:flex-end;">
          <button class="btn btn-ghost btn-sm" id="resume-new">Új projektet indítok</button>
          <button class="btn btn-primary btn-sm" id="resume-continue">Folytatom a projektet</button>
        </div>
      </div>`;
      document.body.appendChild(overlay);
      document.getElementById('resume-continue').onclick = ()=>{ S = saved; overlay.remove(); render(); };
      document.getElementById('resume-new').onclick = ()=>{ clearState(); S = freshState(); overlay.remove(); render(); };
      return true;
    }
  }catch(e){}
  return false;
}

/* ---------------------------------------------------------
   12. MAIN RENDER SWITCH
--------------------------------------------------------- */
function render(){
  switch(S.screen){
    case 'landing': renderLanding(); break;
    case 'nickname': renderNickname(); break;
    case 'howto': renderHowTo(); break;
    case 'mission': renderMission(); break;
    case 'feedback': renderFeedback(); break;
    case 'result': if(!S.result) finalizeResult(); renderResult(); break;
    case 'leaderboard': renderLeaderboard(); break;
    default: renderLanding();
  }
}

if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  document.documentElement.classList.add('reduced-motion');
}

// Initial boot: if there's a resumable session, ask; otherwise render current state.
if(!maybeShowResume()){
  render();
}
</script>
